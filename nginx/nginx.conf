upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name door-app.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name door-app.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/door-app.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/door-app.duckdns.org/privkey.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}